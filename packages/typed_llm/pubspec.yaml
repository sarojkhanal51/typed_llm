name: typed_llm
description: >-
  Type-safe, validated, structured output from LLM providers (OpenAI, Gemini,
  Claude) via generated JSON Schemas. No dart:mirrors, no runtime reflection.
version: 0.1.1
homepage: https://github.com/sarojkhanal51/typed_llm
repository: https://github.com/sarojkhanal51/typed_llm
issue_tracker: https://github.com/sarojkhanal51/typed_llm/issues
topics:
  - llm
  - json-schema
  - structured-output
  - openai
  - gemini

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  http: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
