name: typed_llm_example
description: >-
  Example app for typed_llm: annotated models (including a freezed class),
  the code generator, and extraction via multiple providers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  freezed_annotation: ^3.0.0
  typed_llm: ^0.1.3

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^3.0.0
  lints: ^5.0.0
  typed_llm_generator: ^0.1.0

dependency_overrides:
  typed_llm:
    path: ../typed_llm
  typed_llm_generator:
    path: ../typed_llm_generator
