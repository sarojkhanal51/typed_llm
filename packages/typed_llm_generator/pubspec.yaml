name: typed_llm_generator
description: >-
  build_runner code generator that turns @LlmSchema-annotated classes into
  JSON Schemas and validated-JSON factories for the typed_llm package.
version: 0.2.3
homepage: https://github.com/sarojkhanal51/typed_llm
repository: https://github.com/sarojkhanal51/typed_llm
issue_tracker: https://github.com/sarojkhanal51/typed_llm/issues
topics:
  - llm
  - json-schema
  - build-runner
  - code-generation

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  typed_llm: ^0.2.0
  build: '>=4.0.0 <5.0.0'
  source_gen: '>=4.0.0 <5.0.0'
  # Deliberately wide: a generator must co-resolve with whatever other
  # codegen packages (freezed, json_serializable) pin in the same app.
  analyzer: '>=9.0.0 <15.0.0'

dev_dependencies:
  lints: ^5.0.0
  logging: ^1.2.0
  test: ^1.25.0
  build_test: ^3.0.0
  build_runner: ^2.4.0
