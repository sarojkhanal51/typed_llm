name: typed_llm_generator
description: >-
  build_runner code generator that turns @LlmSchema-annotated classes into
  JSON Schemas and validated-JSON factories for the typed_llm package.
version: 0.1.0
homepage: https://github.com/sarojkhanal51/typed_llm
repository: https://github.com/sarojkhanal51/typed_llm
issue_tracker: https://github.com/sarojkhanal51/typed_llm/issues
topics:
  - llm
  - json-schema
  - build-runner
  - code-generation

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  typed_llm: ^0.1.0
  build: ^2.4.0
  source_gen: ^1.5.0
  analyzer: '>=6.4.0 <7.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  build_test: ^2.2.0
  build_runner: ^2.4.0

# Resolved from the sibling package on disk during monorepo development.
# Remove once typed_llm 0.1.0 is published and this override is no longer needed.
dependency_overrides:
  typed_llm:
    path: ../typed_llm
