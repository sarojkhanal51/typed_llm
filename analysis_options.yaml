# Shared analysis config for every package in this monorepo.
# Package-level analysis_options.yaml files `include` this file.
include: package:lints/recommended.yaml

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - unawaited_futures

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
